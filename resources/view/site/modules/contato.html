    .overlay-bottom::after {
        content: ""; /* Necessário para o elemento existir */
        position: absolute;
        width: 100%;
        height: 80px; /* Altura da imagem da borda; ajuste se necessário */
        bottom: 0;
        left: 0;
        background: url('{{URL}}/resources/assets/img/overlay-bottom.png') bottom center no-repeat !important;
        background-size: cover !important; /* Faz a borda esticar por toda a largura */
        z-index: 1;
    }
</style>

<!-- Contact Start -->
<div class="container-fluid py-5">

                <div class="bg-light d-flex flex-column justify-content-center px-5" style="height: 450px;">
                    <div class="d-flex align-items-center mb-5">
                        <div class="btn-icon bg-primary mr-4">
                            <i class="fa fa-2x fa-map-marker-alt text-white"></i>
                        </div>
                        <div class="mt-n1">

                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-5">
                        <div class="btn-icon bg-secondary mr-4">
                            <i class="fa fa-2x fa-phone-alt text-white"></i>
                        </div>
                        <div class="mt-n1">

                <div class="contact-form">
                    <form id="contato-contact" method="post">

                                    <input type="text" id="c_nome" name="c_nome" class="form-control border-top-0 border-right-0 border-left-0 p-0" placeholder="Seu nome" required="required">

                            </div>

                                <textarea class="form-control border-top-0 border-right-0 border-left-0 p-0" rows="5" id="mensagem" name="mensagem" placeholder="Mensagem" required="required"></textarea>
