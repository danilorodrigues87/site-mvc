<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="bg-white p-4 p-md-5 shadow-sm" style="border-left: 8px solid #2878EB;">
                <div class="text-center mb-4">
                    <i class="fa fa-certificate fa-3x text-primary mb-3"></i>
                    <h1 class="h3 text-dark">Validação de certificado</h1>
                </div>

                <div class="section-title position-relative mb-4">
                    <h6 class="d-inline-block position-relative text-secondary text-uppercase pb-2">Certificamos que</h6>
                    <h2 class="display-5 text-dark">{{aluno}}</h2>
                </div>

                <p class="lead text-body mb-4">
                    Concluiu com êxito o curso de <span class="text-primary font-weight-bold">{{curso}}</span>
                </p>

                <h5>Composto pelos módulos:</h5>
                <p>{{modulos}}</p>

                <div class="row pt-3 border-top mt-4">
                    <div class="col-sm-7">
                        <h6 class="text-uppercase text-muted small mb-1">Instituição</h6>
                        <p class="font-weight-bold text-primary mb-0">Centro de Técnologia e Inovação Educacional</p>
                    </div>
                    <div class="col-sm-5 text-sm-right mt-3 mt-sm-0">
                        <h6 class="text-uppercase text-muted small mb-1">Código de autenticidade</h6>
                        <code class="text-secondary">{{codigo}}</code>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button onclick="compartilharCertificado('{{codigo}}')" class="btn btn-outline-primary">
                        <i class="fa fa-share-alt mr-2"></i> Compartilhar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function compartilharCertificado(codigo) {
    var url = (document.body.getAttribute('data-base-url') || '') + '/certificado?crt=' + encodeURIComponent(codigo);
    if (navigator.share) {
        navigator.share({
            title: 'Certificado — CTI Educacional',
            text: 'Confira a validação deste certificado.',
            url: url
        }).catch(function(){});
    } else {
        window.open(url, '_blank');
    }
}
</script>
